name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
  macos-agent:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Check system Bash syntax
        run: |
          /bin/bash -n agent/macflare.sh
          /bin/bash -n scripts/install.sh
          /bin/bash -n scripts/uninstall.sh
      - name: Check native JavaScript syntax
        run: |
          node --check agent/runtime.js
          node --check agent/window-runtime.js
      - name: Run macOS native smoke checks
        run: |
          python3 agent/tests/native-smoke.py
          python3 agent/tests/window-native.py
      - name: Test application icon bundle discovery
        run: python3 -B scripts/tests/test_export_app_icons.py

  check:
    name: check
    if: always()
    needs: [worker, macos-agent]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all platform checks
        env:
          WORKER_RESULT: ${{ needs.worker.result }}
          MACOS_RESULT: ${{ needs.macos-agent.result }}
        run: test "$WORKER_RESULT" = success && test "$MACOS_RESULT" = success
